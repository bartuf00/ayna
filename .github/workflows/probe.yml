name: Probe runner
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Xcode versions
        run: ls /Applications/ | grep -i xcode
      - name: Default device platforms
        run: ls /Applications/Xcode.app/Contents/Developer/Platforms/
      - name: Xcode 26.0 platforms
        run: ls /Applications/Xcode_26.0.app/Contents/Developer/Platforms/ 2>/dev/null || echo "no Xcode_26.0"
      - name: iOS device support (default)
        run: ls /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/DeviceSupport/ 2>/dev/null
      - name: Simulator runtimes
        run: xcrun simctl runtime list 2>&1 | head -20 || xcrun simctl list runtimes
